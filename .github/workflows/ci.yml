name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v3
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma clients
        run: |
          cd services/games && bun run prisma:generate
          cd ../wallets && bun run prisma:generate

      - name: Typecheck backend
        run: |
          cd services/games && bun node_modules/typescript/bin/tsc --noEmit
          cd ../wallets && bun node_modules/typescript/bin/tsc --noEmit

      - name: Unit tests
        run: bun test packages/auth/tests packages/contracts/tests services/wallets/tests/unit services/games/tests/unit

      - name: Frontend tests
        run: cd frontend && bun test

      - name: Frontend build
        run: cd frontend && bun run build

      - name: Docker compose config
        run: docker compose config
